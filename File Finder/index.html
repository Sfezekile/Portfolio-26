<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Finder</title>
    <link rel="stylesheet" href="window-style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <!-- FILE FINDER CONTAINER -->
    <div class="window" id="window">
        <header class="window-header">
            <div class="left-h">
                <div class="page-control">
                    <button class="back-btn"><i class="ri-arrow-left-s-line"></i></button>
                    <button class="prev-btn"><i class="ri-arrow-right-s-line"></i></button>
                    <button class="reload-btn"><i class="ri-reset-left-line"></i></button>
                </div>

                <div class="window-name">
                    <span>File Finder</span>
                </div>
                
            </div>
            <div class="window-control">
                <button class="min-btn" data-action="minimize">─</button>
                <button class="max-btn" data-action="maximize"><i class="ri-square-line"></i></button>
                <button class="close-btn" data-action="close"><i class="ri-close-line"></i></button>
            </div>
        </header>
        <main>
            <nav>
                <ul>

                    <!-- <span class="sub-header">Home</span> -->
                    <li>
                        <ul class="sub-nav">
                            <li><button onclick="openHomeModel()"><i class="ri-computer-fill"></i> Home</button>
                            </li>
                        </ul>
                    </li>
                </ul>
                <ul>

                    <span class="sub-header">Projects</span>
                    <li>
                        <ul class="sub-nav">
                            <li><button onclick="openMiniModel()"><i class="ri-folder-6-fill"></i> Mini Projects</button>
                            </li>
                            <li><button onclick="openCaseModel()"><i class="ri-folder-6-fill"></i> Case Studies</button>
                            </li>
                            <li><button onclick="openResearchModel()"><i class="ri-folder-6-fill"></i> Research</button>
                            </li>
                        </ul>
                    </li>
                </ul>
                <ul>
                    <span class="sub-header">Research</span>
                    <li>
                        <ul class="sub-nav">
                            <li><button onclick="openModel()"><i class="ri-folder-6-fill"></i> Document</button></li>
                            <li><button onclick="openModel()"><i class="ri-folder-6-fill"></i> Document</button></li>
                            <li><button onclick="openModel()"><i class="ri-folder-6-fill"></i> Document</button></li>
                        </ul>
                    </li>
                    <!-- <li><a href="#">About</a></li> -->
                </ul>
            </nav>
            <section class="model">
                <header class="model-header">
                    <div class="page-path">
                        <span>Home</span>
                    </div>
                </header>
                <!-- Home model -->
                <div class="container active" id="home"
                    style="display: grid;">
                    <button onclick="openMiniModel()" class="folder">
                        <div class="folder-img">
                            📁
                        </div>
                        <span>Mini projects</span>
                    </button>
                    <button onclick="openCaseModel()" class="folder">
                        <div class="folder-img">
                            📁
                        </div>
                        <span>Case Studies</span>
                    </button>
                    <button onclick="openResearchModel()" class="folder">
                        <div class="folder-img">
                            📁
                        </div>
                        <span>Research</span>
                    </button>
                </div>
                <!-- Mini Project model -->
                <div class="container active" id="miniProject" style="display: none"></div>
                <!-- Case Studies model -->
                <div class="container" id="caseStudies" style="display: none"></div>
                <!-- Research model -->
                <div class="container" id="research" style="display: none"></div>
            </section>
        </main>
    </div>

    <script>

        const miniProjectFolder = {
            folder_1: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/calendar-icon-svg-download-png-8756633.png?f=webp&w=256',
                fileName: 'Calendar-UI',
                link: 'https://sfezekile.github.io/Calendar-UI/',
            },
            folder_2: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/music-player-icon-svg-download-png-10592997.png?f=webp&w=256',
                fileName: 'MiniPocket-Player',
            },
        };
        const caseFolder = {
            folder_1: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/document-folder-icon-svg-download-png-10290706.png?f=webp&w=256',
                fileName: 'Product Card - Case Study',
                gitLink: 'https://github.com/Sfezekile/case-study-card-1',
            },
            folder_2: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/document-folder-icon-svg-download-png-10290706.png?f=webp&w=256',
                fileName: 'Profile Card - Case Study',
                gitLink: 'https://github.com/Sfezekile/case-study-card-2',
            },
            folder_3: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/document-folder-icon-svg-download-png-10290706.png?f=webp&w=256',
                fileName: 'Animation in CSS - Case Study',
                gitLink: 'https://github.com/Sfezekile/Case-study-animation-1',
            },
            folder_4: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/document-folder-icon-svg-download-png-10290706.png?f=webp&w=256',
                fileName: 'Coffee Customization Card - Case Study',
                gitLink: 'https://github.com/Sfezekile/case-study-card-3',
            },
            folder_5: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/document-folder-icon-svg-download-png-10290706.png?f=webp&w=256',
                fileName: 'Status Indicator Component: A UI/UX Case Study',
                gitLink: 'https://github.com/Sfezekile/case-study-btn-2',
            },
            folder_6: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/document-folder-icon-svg-download-png-10290706.png?f=webp&w=256',
                fileName: 'Button Design Case Study',
                gitLink: 'https://github.com/Sfezekile/case-study-btn-1',
            },
        };
        const researchFolder = {
            folder_1: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/document-folder-icon-svg-download-png-10290706.png?f=webp&w=256',
                fileName: 'Plants in Space',
            },
            folder_2: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/document-folder-icon-svg-download-png-10290706.png?f=webp&w=256',
                fileName: 'e-com UI',
            },
            folder_3: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/document-folder-icon-svg-download-png-10290706.png?f=webp&w=256',
                fileName: 'React Apps',
            },
            folder_4: {
                icon: 'https://cdn.iconscout.com/icon/premium/png-512-thumb/document-folder-icon-svg-download-png-10290706.png?f=webp&w=256',
                fileName: 'Landing Page Designs',
            },
        };

        function openHomeModel() {
            document.getElementById('miniProject').style.display = 'none';
            document.getElementById('caseStudies').style.display = 'none';
            document.getElementById('research').style.display = 'none';
            document.getElementById('home').style.display = 'grid';
            document.querySelector('.page-path span').textContent = 'Home';
        }
        function openMiniModel() {
            document.getElementById('miniProject').style.display = 'grid';
            document.getElementById('caseStudies').style.display = 'none';
            document.getElementById('research').style.display = 'none';
            document.getElementById('home').style.display = 'none';
            document.querySelector('.page-path span').textContent = 'Mini Projects';

            let html = '';
            for (const folder in miniProjectFolder) {
                const project = miniProjectFolder[folder];
                html += `
                    <a src="${project.gitLink}" target="_blank" class="file">
                        <div class="folder-img">
                            <img src="${project.icon}">
                        </div>
                        <span>${project.fileName}</span>
                    </a>
                `;
            }
            document.getElementById('miniProject').innerHTML = html;
        }
        function openCaseModel() {
            document.getElementById('miniProject').style.display = 'none';
            document.getElementById('research').style.display = 'none';
            document.getElementById('home').style.display = 'none';
            document.getElementById('caseStudies').style.display = 'grid';
            document.querySelector('.page-path span').textContent = 'Case Studies';

            let html = '';
            for (const folder in caseFolder) {
                const project = caseFolder[folder];
                html += `
                    <a href="${project.gitLink}" target="_blank" class="file">
                        <div class="folder-img">
                            <img src="${project.icon}">
                        </div>
                        <span>${project.fileName}</span>
                    </a>
                `;
            }
            document.getElementById('caseStudies').innerHTML = html;
        }
        function openResearchModel() {
            document.getElementById('research').style.display = 'grid';
            document.getElementById('home').style.display = 'none';
            document.getElementById('miniProject').style.display = 'none';
            document.getElementById('caseStudies').style.display = 'none';
            document.querySelector('.page-path span').textContent = 'Research';

            let html = '';
            for (const folder in researchFolder) {
                const project = researchFolder[folder];
                html += `
                    <a src="${project.gitLink}" target="_blank" class="file">
                        <div class="folder-img">
                            <img src="${project.icon}">
                        </div>
                        <span>${project.fileName}</span>
                    </a>
                `;
            }
            document.getElementById('research').innerHTML = html;
        } 
    </script>

</body>

</html>
